info:
  name: Logout — Invalidate Session
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/authentication/logout"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: '{ "message": "Session logged out successfully." }'

docs: Invalidates the current Bearer session token.
