info:
  name: Terminate Subscriber
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{base_url}}/aaa_db/subscribers/{{account_id}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "reason": "Subscriber requested cancellation",
        "requested_by": "crm-agent-03"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK
    request:
      url: ""
      method: DELETE
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "status": "success",
            "account_status": "terminated",
            "terminated_at": "2024-07-01T09:00:00Z",
            "message": "Subscriber terminated. AAA session has been disconnected."
          }
  - name: 404 Not Found
    request:
      url: ""
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: '{ "status": "error", "code": "SUBSCRIBER_NOT_FOUND", "message": "No subscriber found for account_id ACC-001234." }'
  - name: 409 Already Terminated
    request:
      url: ""
      method: DELETE
    response:
      status: 409
      statusText: Conflict
      body:
        type: text
        data: '{ "status": "error", "code": "ALREADY_TERMINATED", "message": "Subscriber account is already terminated." }'

docs: Sets `account_status` to `terminated`, blocks the account in Radiator AAA, drops any active session, and closes all associated `subs_accounting` sessions.
