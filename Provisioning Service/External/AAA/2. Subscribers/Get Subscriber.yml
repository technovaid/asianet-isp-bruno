info:
  name: Get Subscriber
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/aaa_db/subscribers/{{account_id}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK
    request:
      url: ""
      method: GET
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: |-
          {
            "account_id": "ACC-001234",
            "username": "user001@isp.net",
            "account_status": "active",
            "service_type": "IPOE",
            "packet_service": "PKT-100M",
            "radius_policy": "PKG-100M",
            "email_id": "user001@mail.com",
            "create_date": "2024-01-01T08:00:00Z",
            "last_modified_date": "2024-06-15T10:00:00Z"
          }
  - name: 404 Not Found
    request:
      url: ""
      method: GET
    response:
      status: 404
      statusText: Not Found
      body:
        type: text
        data: '{ "status": "error", "code": "SUBSCRIBER_NOT_FOUND", "message": "No subscriber found for account_id ACC-001234." }'

docs: Retrieves the full subscriber profile from the `subscribers` table by `account_id`.
