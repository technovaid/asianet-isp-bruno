info:
  name: Generate Token
  type: http
  seq: 1

http:
  method: POST
  url: http://10.10.4.2/amt/1.1/atm/generateToken
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
          "email": "gradeplus@asianet.co.id",
          "password": "Amt@2026"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
            const jsonData = res.getBody();
            const accessToken = jsonData.body.accessToken;
            bru.collectionVariables.set("netcoAccessToken", accessToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

